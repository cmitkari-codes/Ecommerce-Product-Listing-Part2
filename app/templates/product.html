{% extends 'base.html' %}{% block content %}<section id="product-detail" class="product-detail" data-product-id="{{ product_id }}"><p>Loading product…</p></section><script>
(async()=>{const box=document.getElementById('product-detail');try{const r=await fetch('/api/products/{{ product_id }}');const d=await r.json();if(!r.ok)throw Error(d.error);const p=d.product;box.innerHTML=`<img src="${p.image}" alt="${p.name}"><div><h1>${p.name}</h1><p>${p.description}</p><p class="price">₹${Number(p.price).toFixed(2)}</p><p>Available stock: ${p.stock}</p><button data-add-cart="${p.id}">Add to cart</button></div>`;}catch(e){box.textContent=e.message;}})();</script>{% endblock %}
