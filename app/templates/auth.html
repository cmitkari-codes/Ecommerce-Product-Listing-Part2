{% extends 'base.html' %}{% block content %}<section class="auth-card"><h1>{{ 'Create account' if mode=='register' else 'Login' }}</h1><form method="post">{% if mode=='register' %}<label>Username<input name="username" minlength="3" maxlength="40" required></label><label>Email<input type="email" name="email" required></label>{% else %}<label>Username or email<input name="identity" required></label>{% endif %}<label>Password<input type="password" name="password" minlength="8" required></label><button class="primary">{{ 'Register' if mode=='register' else 'Login' }}</button></form><p>{% if mode=='register' %}Already registered? <a href="{{ url_for('auth.login') }}">Login</a>{% else %}New here? <a href="{{ url_for('auth.register') }}">Create an account</a>{% endif %}</p></section>{% endblock %}
